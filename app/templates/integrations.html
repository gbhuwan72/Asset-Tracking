{% extends "base.html" %}
{% block content %}
<h2>Integrations</h2>
<table>
<tr><th>Provider</th><th>Status</th><th>Last Success</th><th>Action</th></tr>
{% for c in connections %}
<tr>
  <td>{{ c.provider }}</td>
  <td>{{ c.status }}</td>
  <td>{{ c.last_success_at or '-' }}</td>
  <td>
    <form method="post" action="/integrations/{{ c.provider }}/sync">
      <button type="submit">Run Sync</button>
    </form>
  </td>
</tr>
{% endfor %}
</table>
{% endblock %}
